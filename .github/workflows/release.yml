name: Source candidate

# Tagging creates unsigned review material only. Approved originals are signed,
# staged, voted on and promoted by the release manager; see RELEASING.md.
on:
  push:
    tags:
      - 'v*-rc[0-9]*'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc([1-9][0-9]*)$ ]]; then
            echo 'Invalid release candidate tag' >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Run source packaging regression tests
        run: python -m unittest discover -s test -p 'release_source_test.py'
      - name: Make unsigned source candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: python scripts/release_source.py prepare --ref "$TAG" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-source-candidate
          path: source-dist/*
          if-no-files-found: error
